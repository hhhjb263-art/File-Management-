[Controls]
Style=FluentWinUI3

# 主题不在这里钉死。
# 主题由 C++ 侧 src/core/AppTheme 统一驱动（QStyleHints::setColorScheme + QGuiApplication::setPalette）：
# 写死 Theme=Light 会让深色模式下 FluentWinUI3 的内建控件
# （TextField / ComboBox / Switch / Menu / ScrollBar…）停在浅色，与自绘控件割裂。
[FluentWinUI3]
Accent=System

# Material 风格未被使用（Style=FluentWinUI3），保留段落以便将来切换风格时可按主题覆盖。
[Material]
